<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    
    <title>My Project</title>

    <!-- Synchronously enable the project airlock -->
    <script src="./scripts/airlock-engine.js"></script>
    <script>
        new AirlockEngine({ 
            debug: true,
            attribute: 'data-airlock' // Can be customized per project if desired
        }).start();
    </script>
    
    <!-- Link to external files -->
    <link rel="stylesheet" src="./stylesheets/main.css" data-airlock="./stylesheets/main.css">
</head>
<body>
    <h1>My Project</h1>

    <img src="./stylesheets/diagram.png"
        data-airlock="./stylesheets/diagram.png"
        width="200px"
        alt="Diagram illustrating the project">

    <p>
        <a href="./about.html" data-airlock="./about.html">
            Introduces safe linking
        </a>
    </p>
</body>
</html>
